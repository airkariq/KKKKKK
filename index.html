<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엑셀/CSV 데이터 필터링 도구</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) CDN -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Table scroll styling */
        .table-container {
            max-height: 500px;
            overflow-y: auto;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-file-excel text-2xl"></i>
                엑셀 / CSV 데이터 필터링 도구
            </h1>
            <span class="text-xs bg-indigo-700 px-3 py-1 rounded-full text-indigo-200">순수 JS + HTML</span>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-grow flex flex-col gap-6">

        <!-- Step 1: File Upload Section -->
        <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
            <h2 class="text-lg font-semibold mb-3 flex items-center gap-2 text-indigo-900">
                <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold">1</span>
                파일 업로드
            </h2>
            <div class="flex flex-col sm:flex-row items-center gap-4">
                <label for="fileInput" class="w-full sm:w-auto cursor-pointer bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium px-6 py-3 rounded-lg border border-indigo-200 transition flex items-center justify-center gap-2">
                    <i class="fa-solid fa-upload"></i>
                    <span>xlsx, csv 파일 선택</span>
                </label>
                <input type="file" id="fileInput" accept=".xlsx, .xls, .csv" class="hidden">
                <span id="fileName" class="text-sm text-slate-500 truncate max-w-md">선택된 파일 없음 (.xlsx, .xls, .csv 지원)</span>
            </div>
        </section>

        <!-- Step 2: Filter Section (Hidden initial) -->
        <section id="filterSection" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden transition-all duration-300">
            <h2 class="text-lg font-semibold mb-4 flex items-center gap-2 text-indigo-900">
                <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold">2</span>
                값 필터 설정
            </h2>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 items-end">
                <!-- Select Column -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">대상 열 선택</label>
                    <select id="columnSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <!-- Dynamic options -->
                    </select>
                </div>

                <!-- Select Condition Operator -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">필터 조건</label>
                    <select id="operatorSelect" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                        <option value="contains">포함 (Contains)</option>
                        <option value="equals">일치 (Equals)</option>
                        <option value="startsWith">시작문자 (Starts with)</option>
                        <option value="endsWith">끝문자 (Ends with)</option>
                        <option value="gt">크다 ( &gt; )</option>
                        <option value="gte">크거나 같다 ( &gt;= )</option>
                        <option value="lt">작다 ( &lt; )</option>
                        <option value="lte">작거나 같다 ( &lt;= )</option>
                    </select>
                </div>

                <!-- Input Filter Value -->
                <div>
                    <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">검색/비교할 값</label>
                    <input type="text" id="filterValue" placeholder="필터링할 값 입력..." class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:outline-none text-sm">
                </div>

                <!-- Action Buttons -->
                <div class="flex gap-2">
                    <button id="btnApplyFilter" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-1.5 text-sm shadow-sm">
                        <i class="fa-solid fa-filter"></i> 필터 적용
                    </button>
                    <button id="btnResetFilter" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium py-2.5 px-4 rounded-lg transition flex items-center justify-center gap-1.5 text-sm">
                        <i class="fa-solid fa-rotate-left"></i> 초기화
                    </button>
                </div>
            </div>
        </section>

        <!-- Step 3: Data Preview & Export Section (Hidden initial) -->
        <section id="resultSection" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden flex-grow flex flex-col">
            <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-4">
                <div class="flex items-center gap-3">
                    <h2 class="text-lg font-semibold flex items-center gap-2 text-indigo-900">
                        <span class="w-6 h-6 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-bold">3</span>
                        데이터 미리보기
                    </h2>
                    <span id="recordCount" class="text-xs bg-slate-100 text-slate-600 px-2.5 py-1 rounded-full border border-slate-200">
                        총 0개 항목
                    </span>
                </div>

                <!-- Download Buttons -->
                <div class="flex gap-2 w-full sm:w-auto">
                    <button id="btnDownloadXlsx" class="flex-1 sm:flex-none bg-emerald-600 hover:bg-emerald-700 text-white font-medium px-4 py-2 rounded-lg transition flex items-center justify-center gap-2 text-sm shadow-sm">
                        <i class="fa-solid fa-file-excel"></i> Excel 저장
                    </button>
                    <button id="btnDownloadCsv" class="flex-1 sm:flex-none bg-sky-600 hover:bg-sky-700 text-white font-medium px-4 py-2 rounded-lg transition flex items-center justify-center gap-2 text-sm shadow-sm">
                        <i class="fa-solid fa-file-csv"></i> CSV 저장
                    </button>
                </div>
            </div>

            <!-- Table Container -->
            <div class="table-container border border-slate-200 rounded-lg flex-grow bg-white">
                <table id="dataTable" class="w-full text-left text-sm text-slate-600 border-collapse">
                    <thead class="bg-slate-100 text-slate-700 sticky top-0 border-b border-slate-200 shadow-sm">
                        <tr id="tableHead">
                            <!-- Header columns dynamically inserted -->
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        <!-- Data rows dynamically inserted -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <!-- Custom Alert Container -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-800 text-white px-5 py-3 rounded-lg shadow-lg hidden transition-opacity duration-300 text-sm flex items-center gap-2 z-50">
        <i class="fa-solid fa-circle-info text-indigo-400"></i>
        <span id="toastMessage">메시지 내용</span>
    </div>

    <!-- Script Block -->
    <script>
        // Global variables for data state management
        let originalData = [];
        let filteredData = [];
        let headers = [];

        // DOM Element references
        const fileInput = document.getElementById('fileInput');
        const fileNameDisplay = document.getElementById('fileName');
        const filterSection = document.getElementById('filterSection');
        const resultSection = document.getElementById('resultSection');
        const columnSelect = document.getElementById('columnSelect');
        const operatorSelect = document.getElementById('operatorSelect');
        const filterValueInput = document.getElementById('filterValue');
        const btnApplyFilter = document.getElementById('btnApplyFilter');
        const btnResetFilter = document.getElementById('btnResetFilter');
        const btnDownloadXlsx = document.getElementById('btnDownloadXlsx');
        const btnDownloadCsv = document.getElementById('btnDownloadCsv');
        const tableHead = document.getElementById('tableHead');
        const tableBody = document.getElementById('tableBody');
        const recordCount = document.getElementById('recordCount');

        // File Upload Event Listener
        fileInput.addEventListener('change', handleFileUpload);

        // Filter Action Listeners
        btnApplyFilter.addEventListener('click', applyFilter);
        btnResetFilter.addEventListener('click', resetFilter);

        // Download Action Listeners
        btnDownloadXlsx.addEventListener('click', () => downloadFile('xlsx'));
        btnDownloadCsv.addEventListener('click', () => downloadFile('csv'));

        // Keyboard Shortcut: Press Enter in filter input to apply filter
        filterValueInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') applyFilter();
        });

        /**
         * Handle file reading and conversion to JSON using SheetJS
         */
        function handleFileUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            fileNameDisplay.textContent = file.name;

            const reader = new FileReader();

            reader.onload = function (event) {
                try {
                    const data = new Uint8Array(event.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });

                    // Take the first sheet in workbook
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];

                    // Convert worksheet to JSON (array of objects)
                    const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (jsonData.length === 0) {
                        showToast('파일에 데이터가 존재하지 않습니다.');
                        return;
                    }

                    // Store original and filtered data
                    originalData = jsonData;
                    filteredData = [...originalData];

                    // Extract Headers from first row object keys
                    headers = Object.keys(originalData[0]);

                    // Populate Column Select Dropdown
                    populateColumnSelect(headers);

                    // Show sections & render preview
                    filterSection.classList.remove('hidden');
                    resultSection.classList.remove('hidden');
                    renderTable(filteredData);
                    showToast('파일을 성공적으로 불러왔습니다.');

                } catch (err) {
                    console.error(err);
                    showToast('파일을 읽는 도중 오류가 발생했습니다.');
                }
            };

            reader.readAsArrayBuffer(file);
        }

        /**
         * Populate the dropdown for column selection
         */
        function populateColumnSelect(headers) {
            columnSelect.innerHTML = '';
            headers.forEach(header => {
                const option = document.createElement('option');
                option.value = header;
                option.textContent = header;
                columnSelect.appendChild(option);
            });
        }

        /**
         * Filter data based on user constraints
         */
        function applyFilter() {
            const selectedCol = columnSelect.value;
            const operator = operatorSelect.value;
            const targetVal = filterValueInput.value.trim().toLowerCase();

            if (!targetVal && !['contains', 'equals'].includes(operator)) {
                // Keep default behavior for empty text check if needed
            }

            filteredData = originalData.filter(row => {
                const cellVal = row[selectedCol] !== undefined ? String(row[selectedCol]).trim() : '';
                const cellValLower = cellVal.toLowerCase();

                // Number conversion for comparisons
                const numCell = parseFloat(cellVal);
                const numTarget = parseFloat(targetVal);
                const isNumericComp = !isNaN(numCell) && !isNaN(numTarget);

                switch (operator) {
                    case 'contains':
                        return cellValLower.includes(targetVal);
                    case 'equals':
                        return cellValLower === targetVal;
                    case 'startsWith':
                        return cellValLower.startsWith(targetVal);
                    case 'endsWith':
                        return cellValLower.endsWith(targetVal);
                    case 'gt':
                        return isNumericComp ? numCell > numTarget : cellValLower > targetVal;
                    case 'gte':
                        return isNumericComp ? numCell >= numTarget : cellValLower >= targetVal;
                    case 'lt':
                        return isNumericComp ? numCell < numTarget : cellValLower < targetVal;
                    case 'lte':
                        return isNumericComp ? numCell <= numTarget : cellValLower <= targetVal;
                    default:
                        return true;
                }
            });

            renderTable(filteredData);
            showToast(`필터링 완료: ${filteredData.length}개 결과`);
        }

        /**
         * Reset filter to original data state
         */
        function resetFilter() {
            filterValueInput.value = '';
            filteredData = [...originalData];
            renderTable(filteredData);
            showToast('필터 조건이 초기화되었습니다.');
        }

        /**
         * Render table headers and rows
         */
        function renderTable(data) {
            // Update Record Counter
            recordCount.textContent = `총 ${data.length.toLocaleString()}개 항목 (전체: ${originalData.length.toLocaleString()}개)`;

            // Render Header
            tableHead.innerHTML = '';
            headers.forEach(header => {
                const th = document.createElement('th');
                th.className = 'px-4 py-3 font-semibold text-slate-700 whitespace-nowrap';
                th.textContent = header;
                tableHead.appendChild(th);
            });

            // Render Body
            tableBody.innerHTML = '';
            
            if (data.length === 0) {
                const tr = document.createElement('tr');
                tr.innerHTML = `<td colspan="${headers.length}" class="text-center py-8 text-slate-400">필터링 결과가 없습니다.</td>`;
                tableBody.appendChild(tr);
                return;
            }

            // Display up to 500 rows for rendering performance
            const previewLimit = 500;
            const displayData = data.slice(0, previewLimit);

            displayData.forEach(row => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-50/80 transition-colors';

                headers.forEach(header => {
                    const td = document.createElement('td');
                    td.className = 'px-4 py-2.5 whitespace-nowrap text-slate-600 border-t border-slate-100 max-w-xs truncate';
                    td.textContent = row[header] !== undefined ? row[header] : '';
                    td.title = row[header] !== undefined ? row[header] : ''; // Tooltip on hover
                    tr.appendChild(td);
                });

                tableBody.appendChild(tr);
            });
        }

        /**
         * Download filtered data as XLSX or CSV
         */
        function downloadFile(type) {
            if (!filteredData || filteredData.length === 0) {
                showToast('저장할 필터링된 데이터가 없습니다.');
                return;
            }

            // Create a new sheet from JSON
            const worksheet = XLSX.utils.json_to_sheet(filteredData, { header: headers });
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "FilteredResult");

            const timestamp = new Date().toISOString().slice(0, 10);
            const originalFileName = fileInput.files[0]?.name.replace(/\.[^/.]+$/, "") || "filtered_data";

            if (type === 'xlsx') {
                XLSX.writeFile(workbook, `${originalFileName}_filtered_${timestamp}.xlsx`);
            } else if (type === 'csv') {
                XLSX.writeFile(workbook, `${originalFileName}_filtered_${timestamp}.csv`, { bookType: 'csv' });
            }

            showToast(`파일이 ${type.toUpperCase()} 형식으로 다운로드되었습니다.`);
        }

        /**
         * Utility to display toast messages
         */
        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');

            toastMessage.textContent = message;
            toast.classList.remove('hidden');

            setTimeout(() => {
                toast.classList.add('hidden');
            }, 3000);
        }
    </script>
</body>
</html>
